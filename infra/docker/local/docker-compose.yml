services:
  postgres:
    image: postgres:16
    container_name: synapse-postgres
    ports:
      - "${SYNAPSE_POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=synapse_gateway
      - POSTGRES_USER=synapse
      - POSTGRES_PASSWORD=local-dev-postgres-password
      - SYNAPSE_GATEWAY_DB=synapse_gateway
      - SYNAPSE_GATEWAY_APP_USER=synapse_gateway_app
      - SYNAPSE_GATEWAY_APP_PASSWORD=local-dev-gateway-app-password
      - SYNAPSE_GATEWAY_READONLY_USER=synapse_gateway_ro
      - SYNAPSE_GATEWAY_READONLY_PASSWORD=local-dev-gateway-readonly-password
      - SYNAPSE_GATEWAY_MIGRATOR_USER=synapse_gateway_migrator
      - SYNAPSE_GATEWAY_MIGRATOR_PASSWORD=local-dev-gateway-migrator-password
      - SYNAPSE_ADMIN_DB=synapse_gateway_admin
      - SYNAPSE_ADMIN_APP_USER=synapse_admin_app
      - SYNAPSE_ADMIN_APP_PASSWORD=local-dev-admin-app-password
      - SYNAPSE_ADMIN_READONLY_USER=synapse_admin_ro
      - SYNAPSE_ADMIN_READONLY_PASSWORD=local-dev-admin-readonly-password
      - SYNAPSE_ADMIN_MIGRATOR_USER=synapse_admin_migrator
      - SYNAPSE_ADMIN_MIGRATOR_PASSWORD=local-dev-admin-migrator-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: synapse-minio-oss
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=local-dev-minio-admin
      - MINIO_ROOT_PASSWORD=local-dev-minio-password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  otterscan:
    image: otterscan/otterscan:latest
    container_name: synapse-otterscan
    ports:
      - "5100:80"
    environment:
      # 指向本地运行的 Hardhat 节点：因为 Otterscan 是在本地浏览器运行的，所以这里使用 localhost:8545 即可访问宿主机的 Hardhat
      - ERIGON_URL=http://localhost:8545
    restart: unless-stopped

  redis:
    image: redis:7.2
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Analytics Pipeline ─────────────────────────────────────────────────────

  kafka:
    profiles: ["analytics"]
    image: apache/kafka:3.7.1
    container_name: synapse-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-ui:
    profiles: ["analytics"]
    image: provectuslabs/kafka-ui:latest
    container_name: synapse-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  clickhouse:
    profiles: ["analytics"]
    image: clickhouse/clickhouse-server:24.3
    container_name: synapse-clickhouse
    ports:
      - "8123:8123" # HTTP interface (queries, health)
      - "9100:9000" # Native TCP interface (avoid collision with minio)
    environment:
      CLICKHOUSE_DB: synapse_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../../clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis-data:
  kafka-data:
  clickhouse-data:
