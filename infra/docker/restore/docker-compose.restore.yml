services:
  postgres-restore:
    image: postgres:16
    container_name: synapse-postgres-restore
    environment:
      POSTGRES_DB: synapse_gateway_restore
      POSTGRES_USER: synapse_restore
      POSTGRES_PASSWORD: restore-local-only-password
    ports:
      - "127.0.0.1:${SYNAPSE_RESTORE_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_restore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse_restore -d synapse_gateway_restore"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse-restore:
    image: clickhouse/clickhouse-server:24.3
    container_name: synapse-clickhouse-restore
    environment:
      CLICKHOUSE_DB: synapse_analytics_restore
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:${SYNAPSE_RESTORE_CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "127.0.0.1:${SYNAPSE_RESTORE_CLICKHOUSE_NATIVE_PORT:-19100}:9000"
    volumes:
      - clickhouse_restore_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_restore_data:
  clickhouse_restore_data:
