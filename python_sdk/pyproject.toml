[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-client"
version = "0.1.0"
description = "Buyer SDK for Synapse Network service discovery and paid invoke"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
  { name = "A2A-Pay Team" }
]
dependencies = [
  "requests>=2.31.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["buyer_sdk*"]
exclude = ["seller_api*", "examples*", "venv*", "__pycache__*"]
