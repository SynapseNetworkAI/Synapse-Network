version: "3.9"

services:
  minio:
    image: minio/minio
    container_name: a2a-minio-oss
    ports:
      - "9000:9000"         # API port
      - "9001:9001"         # Web Console port
    environment:
      - MINIO_ROOT_USER=admin     # Username
      - MINIO_ROOT_PASSWORD=123456 # Password (must be at least 8 characters)
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  minio_data: