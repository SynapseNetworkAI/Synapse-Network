[mypy]
python_version = 3.13
strict = True
disallow_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
pretty = True

# First rollout is intentionally finance-core only. Full-repo strict typing is
# a separate migration; this gate catches Decimal/float pollution in changed
# money paths without detonating historical service debt.
