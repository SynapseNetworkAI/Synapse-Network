name: Nightly Ops Check

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ops-check
  cancel-in-progress: true

jobs:
  # 定时巡检任务：不是构建代码，而是定期验证线上关键接口和投影是否仍健康可读。
  nightly-check:
    runs-on: ubuntu-latest
    steps:
      # 依次检查配置的 NIGHTLY_* URL，生成 summary，并输出是否失败供后续告警使用。
      - name: Run configured endpoint checks
        id: checks
        env:
          NIGHTLY_GATEWAY_HEALTHCHECK_URL: ${{ vars.NIGHTLY_GATEWAY_HEALTHCHECK_URL }}
          NIGHTLY_ADMIN_GATEWAY_HEALTHCHECK_URL: ${{ vars.NIGHTLY_ADMIN_GATEWAY_HEALTHCHECK_URL }}
          NIGHTLY_DASHBOARD_PROJECTION_URL: ${{ vars.NIGHTLY_DASHBOARD_PROJECTION_URL }}
        run: |
          set -euo pipefail

          endpoints=(
            "$NIGHTLY_GATEWAY_HEALTHCHECK_URL"
            "$NIGHTLY_ADMIN_GATEWAY_HEALTHCHECK_URL"
            "$NIGHTLY_DASHBOARD_PROJECTION_URL"
          )

          configured=0
          failures=0

          for url in "${endpoints[@]}"; do
            if [[ -z "$url" ]]; then
              continue
            fi

            configured=1
            echo "checking $url"
            if ! curl --fail --silent --show-error --location --max-time 20 "$url" >/dev/null; then
              echo "check failed: $url" >&2
              failures=1
            fi
          done

          if [[ "$configured" -eq 0 ]]; then
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Nightly ops check"
              echo "No NIGHTLY_* URL variables configured, skipping checks."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "has_targets=true" >> "$GITHUB_OUTPUT"
          if [[ "$failures" -ne 0 ]]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "failed=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Nightly ops check"
            echo "All configured health endpoints passed."
          } >> "$GITHUB_STEP_SUMMARY"

      # 只有巡检失败且配置了 webhook 时才发通知，避免空配置导致误报。
      - name: Notify on nightly failure
        if: failure() && secrets.OPS_ALERT_WEBHOOK_URL != ''
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
        run: |
          payload='{"text":"Synapse nightly ops check failed. Please inspect the GitHub Actions run and production health endpoints."}'
          curl --silent --show-error --fail \
            -X POST \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$OPS_ALERT_WEBHOOK_URL"