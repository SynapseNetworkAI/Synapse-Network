name: Deploy Production
run-name: Deploy Production - ${{ inputs.deploy_scope || 'auto' }} - ${{ inputs.source_ref || 'main' }} - record ${{ inputs.record_id }}

on:
  workflow_dispatch:
    inputs:
      requirement_id:
        required: true
        type: string
      record_id:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      source_ref_type:
        required: false
        type: choice
        default: branch
        options:
          - branch
          - commit
      source_ref:
        required: false
        type: string
        default: main
      deploy_scope:
        required: true
        type: choice
        options:
          - gateway
          - gateway-admin
          - user-front
          - admin-front
          - docs-front
      actor:
        required: true
        type: string
      trigger_source:
        required: false
        type: string
      callback_url:
        required: false
        type: string
      callback_token:
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: ${{ secrets.PROD_GCP_PROJECT_ID || 'synapse-network-prod' }}
      REGION: ${{ secrets.PROD_GCP_REGION || 'us-central1' }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ secrets.PROD_ARTIFACT_REGISTRY_REPOSITORY || 'synapse-prod' }}
      EVIDENCE_BUCKET: ${{ secrets.PROD_EVIDENCE_BUCKET || 'synapse-prod-evidence-synapse-network-prod' }}
      DEPLOY_SCOPE: ${{ inputs.deploy_scope }}
      CALLBACK_URL: ${{ inputs.callback_url }}
      CALLBACK_TOKEN: ${{ inputs.callback_token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate production Workload Identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ secrets.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ secrets.PROD_GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${WIF_PROVIDER}" ]] || missing+=("PROD_GCP_WORKLOAD_IDENTITY_PROVIDER")
          [[ -n "${DEPLOY_SERVICE_ACCOUNT}" ]] || missing+=("PROD_GCP_DEPLOY_SERVICE_ACCOUNT")
          [[ -n "${PROJECT_ID}" ]] || missing+=("PROD_GCP_PROJECT_ID")
          [[ -n "${REGION}" ]] || missing+=("PROD_GCP_REGION")
          [[ -n "${ARTIFACT_REGISTRY_REPOSITORY}" ]] || missing+=("PROD_ARTIFACT_REGISTRY_REPOSITORY")
          [[ -n "${EVIDENCE_BUCKET}" ]] || missing+=("PROD_EVIDENCE_BUCKET")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required production secret(s): %s\n' "${missing[*]}" >&2
            exit 2
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.PROD_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve production commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          expected="${{ inputs.commit_sha }}"
          if [[ -z "${expected}" ]]; then
            echo "commit_sha is required for production deploy" >&2
            exit 2
          fi
          git checkout --detach "${expected}"
          resolved="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [[ "${resolved}" != "${main_sha}" ]]; then
            echo "Production deploy only accepts the current origin/main commit." >&2
            echo "resolved=${resolved} origin/main=${main_sha}" >&2
            exit 2
          fi
          tag_timestamp="$(date -u '+%Y-%m-%d-%H%M%S')"
          echo "resolved_commit_sha=${resolved}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag_timestamp=${tag_timestamp}" >> "$GITHUB_OUTPUT"
          echo "release_id=prod-${DEPLOY_SCOPE}-${tag_timestamp}" >> "$GITHUB_OUTPUT"

      - name: Validate deploy scope
        shell: bash
        run: |
          set -euo pipefail
          case "${DEPLOY_SCOPE}" in
            gateway|gateway-admin|user-front|admin-front|docs-front) ;;
            *) echo "Unsupported production deploy_scope: ${DEPLOY_SCOPE}" >&2; exit 2 ;;
          esac

      - name: Build production images
        shell: bash
        env:
          TAG: ${{ steps.source.outputs.short_sha }}
          NEXT_PUBLIC_GATEWAY_BASE_URL: https://api.synapse-network.ai
          NEXT_PUBLIC_ANALYTICS_ENDPOINT: https://api.synapse-network.ai/api/v1/events
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_DOCS_BASE_URL: https://docs.synapse-network.ai
          NEXT_PUBLIC_TX_EXPLORER_BASE_URL: https://arbiscan.io
          NEXT_PUBLIC_RPC_URL: https://arb1.arbitrum.io/rpc
          NEXT_PUBLIC_CHAIN_ID: "42161"
          NEXT_PUBLIC_CONTRACT_CONFIG_SOURCE: src/contract-config.arbitrum-one.prod.json
        run: |
          set -euo pipefail
          scripts/deploy/gcp_cloudbuild_staging_images.sh "${PROJECT_ID}" \
            --services "${DEPLOY_SCOPE}" \
            --tag "${{ steps.source.outputs.short_sha }}"

      - name: Deploy selected Cloud Run service
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          image_base="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}"
          case "${DEPLOY_SCOPE}" in
            gateway)
              service="synapse-prod-gateway"
              image="${image_base}/gateway:${{ steps.source.outputs.short_sha }}"
              health_paths="/health /readiness"
              ;;
            gateway-admin)
              service="synapse-prod-gateway-admin"
              image="${image_base}/gateway-admin:${{ steps.source.outputs.short_sha }}"
              health_paths="/health"
              ;;
            user-front)
              service="synapse-prod-user-front"
              image="${image_base}/user-front:${{ steps.source.outputs.short_sha }}"
              health_paths="/"
              ;;
            admin-front)
              service="synapse-prod-admin-front"
              image="${image_base}/admin-front:${{ steps.source.outputs.short_sha }}"
              health_paths="/"
              ;;
            docs-front)
              service="synapse-prod-docs-front"
              image="${image_base}/docs-front:${{ steps.source.outputs.short_sha }}"
              health_paths="/"
              ;;
          esac
          gcloud run deploy "${service}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${image}" \
            --quiet
          url="$(gcloud run services describe "${service}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
          revision="$(gcloud run services describe "${service}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.latestReadyRevisionName)')"
          echo "service=${service}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "health_paths=${health_paths}" >> "$GITHUB_OUTPUT"

      - name: Smoke production service
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          for path in ${{ steps.deploy.outputs.health_paths }}; do
            ok="false"
            for attempt in $(seq 1 10); do
              status="$(curl -sS -o /dev/null -w '%{http_code}' "${url}${path}" || true)"
              if [[ "${status}" == "200" || "${status}" == "204" ]]; then
                ok="true"
                break
              fi
              echo "Production smoke ${url}${path} returned ${status}; retry ${attempt}/10"
              sleep 10
            done
            if [[ "${ok}" != "true" ]]; then
              echo "Production smoke failed for ${url}${path}" >&2
              exit 1
            fi
          done

      - name: Write production deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > production-manifest.json
          const manifest = {
            environment: 'production',
            projectId: process.env.PROJECT_ID,
            region: process.env.REGION,
            deployScope: process.env.DEPLOY_SCOPE,
            recordId: '${{ inputs.record_id }}',
            commitSha: '${{ steps.source.outputs.resolved_commit_sha }}',
            service: '${{ steps.deploy.outputs.service }}',
            revision: '${{ steps.deploy.outputs.revision }}',
            image: '${{ steps.deploy.outputs.image }}',
            url: '${{ steps.deploy.outputs.url }}',
            runId: process.env.GITHUB_RUN_ID,
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }
          console.log(JSON.stringify(manifest, null, 2))
          NODE
          gsutil cp production-manifest.json "gs://${EVIDENCE_BUCKET}/deployments/production/${{ inputs.record_id }}/manifest.json"

      - name: Report success
        if: ${{ success() && env.CALLBACK_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > payload.json
          const payload = {
            status: 'succeeded',
            health_status: 'passed',
            external_run_id: process.env.GITHUB_RUN_ID,
            external_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            commit_sha: '${{ steps.source.outputs.resolved_commit_sha }}',
            notes: 'production deploy succeeded',
            metadata: {
              environment: 'production',
              gcpProject: process.env.PROJECT_ID,
              deployScope: process.env.DEPLOY_SCOPE,
              service: '${{ steps.deploy.outputs.service }}',
              revision: '${{ steps.deploy.outputs.revision }}',
              image: '${{ steps.deploy.outputs.image }}',
              url: '${{ steps.deploy.outputs.url }}',
            },
          }
          console.log(JSON.stringify(payload))
          NODE
          curl --fail --silent --show-error \
            -X POST "${CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${CALLBACK_TOKEN}" \
            --data-binary @payload.json

      - name: Report failure
        if: ${{ failure() && env.CALLBACK_URL != '' }}
        shell: bash
        run: |
          node - <<'NODE' > payload.json
          const payload = {
            status: 'failed',
            health_status: 'failed',
            external_run_id: process.env.GITHUB_RUN_ID,
            external_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            commit_sha: '${{ inputs.commit_sha }}',
            notes: 'production deploy failed; inspect GitHub Actions logs',
          }
          console.log(JSON.stringify(payload))
          NODE
          curl --silent --show-error \
            -X POST "${CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${CALLBACK_TOKEN}" \
            --data-binary @payload.json
