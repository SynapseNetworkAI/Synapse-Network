name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      requirement_id:
        required: true
        type: string
      record_id:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      actor:
        required: true
        type: string
      trigger_source:
        required: false
        type: string
      callback_url:
        required: false
        type: string
      callback_token:
        required: false
        type: string
      rollback_target_sha:
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PRODUCTION_DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Run production deployment
        run: |
          ssh "${{ secrets.PRODUCTION_DEPLOY_USER }}@${{ secrets.PRODUCTION_DEPLOY_HOST }}" \
            "cd '${{ secrets.PRODUCTION_REPO_DIR }}' && COMMIT_SHA='${{ inputs.commit_sha }}' ROLLBACK_TARGET_SHA='${{ inputs.rollback_target_sha }}' ./scripts/deploy/production.sh"
      - name: Report success
        if: ${{ success() && inputs.callback_url != '' }}
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ inputs.callback_token }}" \
            -d "{\"status\":\"succeeded\",\"external_run_id\":\"${{ github.run_id }}\",\"external_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"commit_sha\":\"${{ inputs.rollback_target_sha != '' && inputs.rollback_target_sha || inputs.commit_sha }}\",\"notes\":\"production deploy succeeded\"}"
      - name: Report failure
        if: ${{ failure() && inputs.callback_url != '' }}
        run: |
          curl --silent --show-error \
            -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ inputs.callback_token }}" \
            -d "{\"status\":\"failed\",\"external_run_id\":\"${{ github.run_id }}\",\"external_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"commit_sha\":\"${{ inputs.rollback_target_sha != '' && inputs.rollback_target_sha || inputs.commit_sha }}\",\"notes\":\"production deploy failed\"}"
