name: Deploy Staging Gateway
run-name: Deploy Staging Gateway - ${{ inputs.source_ref || github.ref_name }} - record ${{ inputs.record_id }}

on:
  workflow_dispatch:
    inputs:
      requirement_id:
        required: true
        type: string
      record_id:
        required: true
        type: string
      commit_sha:
        required: false
        type: string
      source_ref_type:
        required: false
        type: choice
        default: branch
        options:
          - branch
          - tag
          - commit
      source_ref:
        required: false
        type: string
      actor:
        required: true
        type: string
      trigger_source:
        required: false
        type: string
      callback_url:
        required: false
        type: string
      callback_token:
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-gateway:
    uses: ./.github/workflows/deploy-staging.yml
    with:
      requirement_id: ${{ inputs.requirement_id }}
      record_id: ${{ inputs.record_id }}
      commit_sha: ${{ inputs.commit_sha || '' }}
      source_ref_type: ${{ inputs.source_ref_type || 'branch' }}
      source_ref: ${{ inputs.source_ref || '' }}
      deploy_scope: gateway
      actor: ${{ inputs.actor }}
      trigger_source: ${{ inputs.trigger_source || '' }}
      callback_url: ${{ inputs.callback_url || '' }}
      callback_token: ${{ inputs.callback_token || '' }}
    secrets: inherit
