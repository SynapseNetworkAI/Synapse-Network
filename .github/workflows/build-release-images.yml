name: Build Release Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-release-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 发布前置检查：识别哪些服务已经具备 Dockerfile，避免当前仓库缺少 Dockerfile 时直接失败。
  preflight:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.detect.outputs.gateway }}
      admin_gateway: ${{ steps.detect.outputs.admin_gateway }}
      admin_front: ${{ steps.detect.outputs.admin_front }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 输出每个服务是否可构建镜像，并把结果写入 job output 供后续 job 判断。
      - name: Detect Dockerfiles
        id: detect
        run: |
          gateway=false
          admin_gateway=false
          admin_front=false

          [[ -f gateway/Dockerfile ]] && gateway=true
          [[ -f admin/gateway-admin/Dockerfile ]] && admin_gateway=true
          [[ -f admin/admin-front/Dockerfile ]] && admin_front=true

          any=false
          if [[ "$gateway" == true || "$admin_gateway" == true || "$admin_front" == true ]]; then
            any=true
          fi

          {
            echo "gateway=$gateway"
            echo "admin_gateway=$admin_gateway"
            echo "admin_front=$admin_front"
            echo "any=$any"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Docker image build preflight"
            echo "- gateway Dockerfile: $gateway"
            echo "- gateway-admin Dockerfile: $admin_gateway"
            echo "- admin-front Dockerfile: $admin_front"
            if [[ "$any" != true ]]; then
              echo "- result: skipped image builds because no Dockerfiles are present yet"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 构建并推送 gateway 镜像到 GHCR，供 staging/production 部署复用。
  build-gateway-image:
    needs: preflight
    if: needs.preflight.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract gateway image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/synapse-gateway
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=main-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 构建并推送 admin gateway 镜像，支撑管理后台后端独立部署。
  build-admin-gateway-image:
    needs: preflight
    if: needs.preflight.outputs.admin_gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract gateway-admin image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/synapse-gateway-admin
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=main-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push gateway-admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin/gateway-admin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 构建并推送 admin front 镜像，作为控制台前端的标准发布产物。
  build-admin-front-image:
    needs: preflight
    if: needs.preflight.outputs.admin_front == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract admin-front image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/synapse-admin-front
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=main-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push admin-front image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin/admin-front/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}