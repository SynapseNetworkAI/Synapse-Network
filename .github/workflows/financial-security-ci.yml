name: Financial Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  financial-security-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enforce PostgreSQL-only storage policy
        run: |
          bash ../scripts/ci/check_postgres_only_storage.sh

      - name: Run financial security test suite
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_financial_*.py
