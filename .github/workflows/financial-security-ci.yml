name: Financial Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  financial-security-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run financial security test suite
        env:
          PYTHONPATH: seller_api
        run: |
          pytest -q seller_api/tests/test_financial_security.py
