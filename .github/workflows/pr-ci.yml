name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ci_scope:
        required: false
        type: choice
        default: auto
        options:
          - auto
          - full

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-scope:
    runs-on: ubuntu-slim
    outputs:
      resolved_mode: ${{ steps.scope.outputs.resolved_mode }}
      run_baseline_static: ${{ steps.scope.outputs.run_baseline_static }}
      run_baseline_quality: ${{ steps.scope.outputs.run_baseline_quality }}
      run_baseline_policy: ${{ steps.scope.outputs.run_baseline_policy }}
      run_frontend: ${{ steps.scope.outputs.run_frontend }}
      run_admin_front: ${{ steps.scope.outputs.run_admin_front }}
      run_gateway: ${{ steps.scope.outputs.run_gateway }}
      run_admin_gateway: ${{ steps.scope.outputs.run_admin_gateway }}
      run_provider_service: ${{ steps.scope.outputs.run_provider_service }}
      run_sdk_python: ${{ steps.scope.outputs.run_sdk_python }}
      run_contracts: ${{ steps.scope.outputs.run_contracts }}
      run_terraform: ${{ steps.scope.outputs.run_terraform }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check agent lessons
        run: npm run ci:agent-lessons
      - name: Resolve PR CI scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          requested_scope="${{ inputs.ci_scope || 'auto' }}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            requested_scope="full"
          fi

          base_ref="origin/main"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base_ref="origin/${GITHUB_BASE_REF}"
          else
            git fetch origin "+refs/heads/main:refs/remotes/origin/main" || true
          fi

          node scripts/ci/resolve_pr_ci_scope.mjs \
            --mode "${requested_scope}" \
            --base "${base_ref}" \
            --head HEAD \
            --json pr-ci-scope.json

          node --input-type=module - <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from "node:fs";

          const scope = JSON.parse(fs.readFileSync("pr-ci-scope.json", "utf8"));
          const commands = new Set(scope.commands || []);
          const includeAny = (items) => items.some((item) => commands.has(item));
          const sdkPythonExists =
            fs.existsSync("sdk/python/requirements.txt") ||
            fs.existsSync("sdk/python/pyproject.toml");

          const outputs = {
            resolved_mode: scope.mode,
            run_baseline_static: includeAny([
              "runtime_preflight",
              "ci_meta_checks",
              "local_runtime_guard_scan",
              "security_secret_scan",
              "e2e_env_isolation_check",
            ]),
            run_baseline_quality: includeAny([
              "code_quality_architecture_scan",
              "quality_budget_check",
              "format_check",
              "diff_coverage_gate",
            ]),
            run_baseline_policy: includeAny([
              "security_money_scan",
              "security_money_ts_scan",
              "finance_approval_safety_scan",
              "finance_mypy_scan",
              "e2e_script_model_drift_scan",
              "docs_checks",
              "release_go_no_go_checks",
              "monitoring_alert_rules",
            ]),
            run_frontend: commands.has("frontend_checks"),
            run_admin_front: commands.has("admin_front_checks"),
            run_gateway: commands.has("gateway_checks"),
            run_admin_gateway: commands.has("admin_gateway_checks"),
            run_provider_service: commands.has("provider_service_checks"),
            run_sdk_python: commands.has("sdk_python_checks") && sdkPythonExists,
            run_contracts: commands.has("contracts_checks"),
            run_terraform: commands.has("terraform_staging_validate"),
          };

          for (const [key, value] of Object.entries(outputs)) {
            console.log(`${key}=${value === true ? "true" : value === false ? "false" : value}`);
          }
          NODE
      - name: Upload resolved scope artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-ci-scope
          path: pr-ci-scope.json
          if-no-files-found: error

  baseline-static:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.run_baseline_static == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - name: Bootstrap CI tools
        run: bash scripts/ci/bootstrap_ci_tools.sh
      - name: Run baseline static shard
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_ONLY_GATES=runtime_preflight,ci_meta_checks,local_runtime_guard_scan,security_secret_scan,e2e_env_isolation_check \
          bash scripts/ci/pr_checks.sh

  baseline-quality:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.run_baseline_quality == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - name: Install root npm dependencies
        run: npm ci
      - name: Bootstrap CI tools
        run: bash scripts/ci/bootstrap_ci_tools.sh
      - name: Run baseline quality shard
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_ONLY_GATES=code_quality_architecture_scan,quality_budget_check,format_check,diff_coverage_gate \
          bash scripts/ci/pr_checks.sh

  baseline-policy:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.run_baseline_policy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/gateway/requirements.txt
            services/gateway-admin/requirements.txt
            sdk/python/requirements.txt
            services/gateway/pyproject.toml
            services/gateway-admin/pyproject.toml
            sdk/python/pyproject.toml
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - name: Install root npm dependencies
        run: npm ci
      - name: Bootstrap CI tools
        run: bash scripts/ci/bootstrap_ci_tools.sh
      - name: Run baseline policy shard
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_ONLY_GATES=security_money_scan,security_money_ts_scan,finance_approval_safety_scan,finance_mypy_scan,e2e_script_model_drift_scan,docs_checks,release_go_no_go_checks,monitoring_alert_rules \
          bash scripts/ci/pr_checks.sh

  frontend:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.run_frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: services/user-front/yarn.lock
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - name: Plan user-front shard
        id: plan
        run: |
          node scripts/ci/frontend_scope_plan.mjs \
            --scope pr-ci-scope.json \
            --project user-front \
            --json user-front-ci-plan.json \
            --github-output "$GITHUB_OUTPUT"
          cat user-front-ci-plan.json
      - uses: actions/cache@v4
        if: ${{ steps.plan.outputs.skip != 'true' }}
        with:
          path: services/user-front/.next/cache
          key: ${{ runner.os }}-user-front-next-${{ hashFiles('services/user-front/yarn.lock', 'services/user-front/package.json', 'services/user-front/next.config.*', 'services/user-front/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-user-front-next-${{ hashFiles('services/user-front/yarn.lock', 'services/user-front/package.json') }}-
      - name: Install user-front dependencies
        if: ${{ steps.plan.outputs.skip != 'true' }}
        run: yarn --cwd services/user-front install --frozen-lockfile
      - name: Run frontend shard
        if: ${{ steps.plan.outputs.skip != 'true' }}
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_ONLY_GATES=frontend_checks \
          bash scripts/ci/pr_checks.sh

  admin-front:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.run_admin_front == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: services/admin-front/yarn.lock
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - name: Install admin-front dependencies
        run: yarn --cwd services/admin-front install --frozen-lockfile
      - name: Run admin-front shard
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_ONLY_GATES=admin_front_checks \
          bash scripts/ci/pr_checks.sh

  gateway:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.run_gateway == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/gateway/requirements.txt
            services/gateway/pyproject.toml
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - name: Run gateway shard
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_ONLY_GATES=gateway_checks,gateway_stress_review_checks,performance_reliability_checks \
          bash scripts/ci/pr_checks.sh

  admin-gateway:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.run_admin_gateway == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/gateway-admin/requirements.txt
            services/gateway-admin/pyproject.toml
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - name: Run gateway-admin shard
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_ONLY_GATES=admin_gateway_checks \
          bash scripts/ci/pr_checks.sh

  provider-service:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.run_provider_service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - name: Run provider-service shard
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_ONLY_GATES=provider_service_checks \
          bash scripts/ci/pr_checks.sh

  sdk-python:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.run_sdk_python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            sdk/python/requirements.txt
            sdk/python/pyproject.toml
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - name: Run sdk-python shard
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_ONLY_GATES=sdk_python_checks \
          bash scripts/ci/pr_checks.sh

  contracts:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.run_contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - name: Install root npm dependencies
        run: npm ci
      - name: Run contracts shard
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_ONLY_GATES=contracts_checks \
          bash scripts/ci/pr_checks.sh

  terraform-staging:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.run_terraform == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v4
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - name: Run Terraform staging validation
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_ONLY_GATES=terraform_staging_validate \
          bash scripts/ci/pr_checks.sh

  pr-checks:
    needs:
      - resolve-scope
      - baseline-static
      - baseline-quality
      - baseline-policy
      - frontend
      - admin-front
      - gateway
      - admin-gateway
      - provider-service
      - sdk-python
      - contracts
      - terraform-staging
    if: ${{ always() }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Summarize shard results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module - <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failures = [];

          for (const [name, status] of Object.entries(needs)) {
            console.log(`[pr-checks] ${name}=${status.result}`);
            if (name === "resolve-scope") {
              if (status.result !== "success") {
                failures.push(`${name}=${status.result}`);
              }
              continue;
            }
            if (!["success", "skipped"].includes(status.result)) {
              failures.push(`${name}=${status.result}`);
            }
          }

          if (failures.length > 0) {
            console.error(`[pr-checks] failing shards: ${failures.join(", ")}`);
            process.exit(1);
          }

          console.log("[pr-checks] all required shards passed");
          NODE
