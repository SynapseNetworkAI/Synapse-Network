name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ci_scope:
        required: false
        type: choice
        default: auto
        options:
          - auto
          - full

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-scope:
    runs-on: ubuntu-slim
    outputs:
      resolved_mode: ${{ steps.scope.outputs.resolved_mode }}
      baseline_static_commands: ${{ steps.scope.outputs.baseline_static_commands }}
      baseline_quality_commands: ${{ steps.scope.outputs.baseline_quality_commands }}
      baseline_policy_commands: ${{ steps.scope.outputs.baseline_policy_commands }}
      user_front_commands: ${{ steps.scope.outputs.user_front_commands }}
      admin_front_commands: ${{ steps.scope.outputs.admin_front_commands }}
      gateway_commands: ${{ steps.scope.outputs.gateway_commands }}
      admin_gateway_commands: ${{ steps.scope.outputs.admin_gateway_commands }}
      contracts_commands: ${{ steps.scope.outputs.contracts_commands }}
      provider_service_commands: ${{ steps.scope.outputs.provider_service_commands }}
      sdk_python_commands: ${{ steps.scope.outputs.sdk_python_commands }}
      terraform_commands: ${{ steps.scope.outputs.terraform_commands }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check agent lessons
        run: npm run ci:agent-lessons
      - name: Resolve PR CI scope
        id: scope
        shell: bash
        env:
          HAS_FULL_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci/full') }}
        run: |
          set -euo pipefail
          requested_scope="${{ inputs.ci_scope || 'auto' }}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${HAS_FULL_LABEL}" == "true" ]]; then
            requested_scope="full"
          fi

          base_ref="origin/main"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base_ref="origin/${GITHUB_BASE_REF}"
          else
            git fetch origin "+refs/heads/main:refs/remotes/origin/main" || true
          fi

          node scripts/ci/resolve_pr_ci_scope.mjs \
            --mode "${requested_scope}" \
            --base "${base_ref}" \
            --head HEAD \
            --json pr-ci-scope.json

          node --input-type=module - <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from "node:fs";

          const scope = JSON.parse(fs.readFileSync("pr-ci-scope.json", "utf8"));
          const commands = new Set(scope.commands || []);
          const pick = (items) => items.filter((item) => commands.has(item)).join(",");
          const emit = (name, value) => console.log(`${name}=${value}`);

          const baselineStatic = [
            "runtime_preflight",
            "ci_meta_checks",
            "local_runtime_guard_scan",
            "security_secret_scan",
            "e2e_env_isolation_check",
          ];
          const baselineQuality = [
            "code_quality_architecture_scan",
            "quality_budget_check",
            "format_check",
            "diff_coverage_gate",
          ];
          const baselinePolicy = [
            "security_money_scan",
            "security_money_ts_scan",
            "finance_approval_safety_scan",
            "finance_mypy_scan",
            "e2e_script_model_drift_scan",
            "docs_checks",
            "release_go_no_go_checks",
            "monitoring_alert_rules",
          ];

          emit("resolved_mode", scope.mode);
          emit("baseline_static_commands", pick(baselineStatic));
          emit("baseline_quality_commands", pick(baselineQuality));
          emit("baseline_policy_commands", pick(baselinePolicy));
          emit("user_front_commands", pick(["frontend_checks"]));
          emit("admin_front_commands", pick(["admin_front_checks"]));
          emit(
            "gateway_commands",
            pick([
              "gateway_checks",
              "gateway_stress_review_checks",
              "performance_reliability_checks",
            ])
          );
          emit("admin_gateway_commands", pick(["admin_gateway_checks"]));
          emit("contracts_commands", pick(["contracts_checks"]));
          emit("provider_service_commands", pick(["provider_service_checks"]));
          emit("sdk_python_commands", pick(["sdk_python_checks"]));
          emit("terraform_commands", pick(["terraform_staging_validate"]));
          NODE

          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs')
          const scope = JSON.parse(fs.readFileSync('pr-ci-scope.json', 'utf8'))
          console.log('## PR CI scope')
          console.log(`- Mode: ${scope.mode}${scope.failClosed ? ' (fail-closed)' : ''}`)
          console.log(`- Affected projects: ${(scope.affectedProjects || []).join(', ') || 'none'}`)
          console.log(`- Risk scopes: ${(scope.riskScopes || []).join(', ') || 'none'}`)
          console.log(`- Commands: ${(scope.commands || []).join(', ') || 'none'}`)
          for (const reason of scope.reasons || []) console.log(`- Reason: ${reason}`)
          NODE
      - name: Upload PR CI scope
        uses: actions/upload-artifact@v4
        with:
          name: pr-ci-scope
          path: pr-ci-scope.json
          if-no-files-found: error

  baseline-static:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.baseline_static_commands != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Bootstrap CI tools
        run: bash scripts/ci/bootstrap_ci_tools.sh
      - name: Run baseline static shard
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_COMMANDS=${{ needs.resolve-scope.outputs.baseline_static_commands }} \
          bash scripts/ci/pr_checks.sh

  baseline-quality:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.baseline_quality_commands != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root npm dependencies
        run: npm ci
      - name: Bootstrap CI tools
        run: bash scripts/ci/bootstrap_ci_tools.sh
      - name: Run baseline quality shard
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_COMMANDS=${{ needs.resolve-scope.outputs.baseline_quality_commands }} \
          bash scripts/ci/pr_checks.sh

  baseline-policy:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.baseline_policy_commands != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/gateway/requirements.txt
            services/gateway-admin/requirements.txt
            sdk/python/requirements.txt
            services/gateway/pyproject.toml
            services/gateway-admin/pyproject.toml
            sdk/python/pyproject.toml
      - name: Install root npm dependencies
        run: npm ci
      - name: Bootstrap CI tools
        run: bash scripts/ci/bootstrap_ci_tools.sh
      - name: Run baseline policy shard
        run: |
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_COMMANDS=${{ needs.resolve-scope.outputs.baseline_policy_commands }} \
          bash scripts/ci/pr_checks.sh

  user-front:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.user_front_commands != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: services/user-front/yarn.lock
      - name: Install user-front dependencies
        run: yarn --cwd services/user-front install --frozen-lockfile
      - name: Run user-front gates
        run: |
          SYNAPSE_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_COMMANDS=${{ needs.resolve-scope.outputs.user_front_commands }} \
          bash scripts/ci/pr_checks.sh

  admin-front:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.admin_front_commands != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: services/admin-front/yarn.lock
      - name: Install admin-front dependencies
        run: yarn --cwd services/admin-front install --frozen-lockfile
      - name: Run admin-front gates
        run: |
          SYNAPSE_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_COMMANDS=${{ needs.resolve-scope.outputs.admin_front_commands }} \
          bash scripts/ci/pr_checks.sh

  gateway:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.gateway_commands != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/gateway/requirements.txt
            services/gateway/pyproject.toml
      - name: Run gateway gates
        run: |
          SYNAPSE_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_COMMANDS=${{ needs.resolve-scope.outputs.gateway_commands }} \
          bash scripts/ci/pr_checks.sh

  gateway-admin:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.admin_gateway_commands != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/gateway-admin/requirements.txt
            services/gateway-admin/pyproject.toml
      - name: Run gateway-admin gates
        run: |
          SYNAPSE_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_COMMANDS=${{ needs.resolve-scope.outputs.admin_gateway_commands }} \
          bash scripts/ci/pr_checks.sh

  contracts:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.contracts_commands != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root npm dependencies
        run: npm ci
      - name: Run contract gates
        run: |
          SYNAPSE_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_COMMANDS=${{ needs.resolve-scope.outputs.contracts_commands }} \
          bash scripts/ci/pr_checks.sh

  provider-service:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.provider_service_commands != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run provider-service gates
        run: |
          SYNAPSE_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_COMMANDS=${{ needs.resolve-scope.outputs.provider_service_commands }} \
          bash scripts/ci/pr_checks.sh

  sdk-python:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.sdk_python_commands != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            sdk/python/requirements.txt
            sdk/python/pyproject.toml
      - name: Run sdk-python gates
        run: |
          SYNAPSE_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_COMMANDS=${{ needs.resolve-scope.outputs.sdk_python_commands }} \
          bash scripts/ci/pr_checks.sh

  terraform:
    needs: resolve-scope
    if: ${{ needs.resolve-scope.outputs.terraform_commands != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: pr-ci-scope
      - uses: hashicorp/setup-terraform@v4
      - name: Run terraform gates
        run: |
          SYNAPSE_SKIP_AGENT_LESSONS=1 \
          SYNAPSE_CI_SCOPE_FILE=pr-ci-scope.json \
          SYNAPSE_CI_COMMANDS=${{ needs.resolve-scope.outputs.terraform_commands }} \
          bash scripts/ci/pr_checks.sh

  pr-checks:
    needs:
      - resolve-scope
      - baseline-static
      - baseline-quality
      - baseline-policy
      - user-front
      - admin-front
      - gateway
      - gateway-admin
      - contracts
      - provider-service
      - sdk-python
      - terraform
    if: ${{ always() }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Summarize sharded PR checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module - <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON)
          const failures = []
          for (const [name, data] of Object.entries(needs)) {
            console.log(`[ci:pr] shard ${name} -> ${data.result}`)
            if (name === "resolve-scope") {
              if (data.result !== "success") failures.push(name)
              continue
            }
            if (!["success", "skipped"].includes(data.result)) {
              failures.push(name)
            }
          }
          if (failures.length) {
            console.error(`[ci:pr] failing shards: ${failures.join(", ")}`)
            process.exit(1)
          }
          console.log("[ci:pr] all selected shards passed or were skipped")
          NODE
